project_id = "socio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"

[edge_runtime]
enabled = true

# verify_jwt = false below: each of these already verifies its own caller
# (Vapi's server secret, Meta's X-Hub-Signature-256, Stripe's event
# signature, or — for quote-accept — the quote's own public_token) instead
# of a Supabase-issued JWT, which Vapi/Meta/Stripe never send.

[functions.voice-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.quote-accept]
verify_jwt = false
